name: Bookstore UI

on:
  push:
    paths:
      - bookstore-ui/**
    branches:
      - 'main'
  pull_request:
    branches: [main]

jobs:
  build-bookstore-ui:
    name: Build bookstore-ui
    runs-on: ubuntu-latest
    env:
      working-directory: ./bookstore-ui
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-ui
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: bookstore-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Publish Docker Image
        run: |
          docker build -t $DOCKER_IMAGE_NAME .
          echo "Pushing the image $DOCKER_IMAGE_NAME to Docker Hub..."
          docker push $DOCKER_IMAGE_NAME