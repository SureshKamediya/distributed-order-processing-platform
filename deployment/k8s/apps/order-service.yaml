apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: bookstore
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_URL: "jdbc:postgresql://orders-db:5432/postgres"
  ORDERS_CATALOG_SERVICE_URL: "http://api-gateway:8989/catalog"
  RABBITMQ_HOST: "bookstore-rabbitmq"
  RABBITMQ_PORT: "5672"
  # External URL your browser/token issuer redirects use — point at the Ingress host
  OAUTH2_SERVER_URL: "http://auth.bookstore.local"
  OAUTH2_SERVER_INTERNAL_URL: "http://keycloak:9191"
  SWAGGER_API_GATEWAY_URL: "http://api-gateway:8989/orders"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://tempo:9411"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: bookstore
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        logging: "promtail"
    spec:
      containers:
        - name: order-service
          image: sureshkamediya/bookstore-order-service
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: rabbitmq-credentials
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
          resources:
            requests:
              memory: 400Mi
            limits:
              memory: 700Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: bookstore
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
