apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: bookstore
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - containerPort: 1025
            - containerPort: 8025
---
# Internal SMTP access for notification-service
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: bookstore
spec:
  type: ClusterIP
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
---
# NodePort so you can open the mail UI directly at localhost:30025
apiVersion: v1
kind: Service
metadata:
  name: mailhog-ui
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: mailhog
  ports:
    - name: web
      port: 8025
      targetPort: 8025
      nodePort: 30025
