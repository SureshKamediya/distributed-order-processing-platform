apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notifications-db-pvc
  namespace: bookstore
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-db
  namespace: bookstore
  labels:
    app: notifications-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-db
  template:
    metadata:
      labels:
        app: notifications-db
    spec:
      containers:
        - name: notifications-db
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: notifications-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              memory: 500Mi
      volumes:
        - name: notifications-db-storage
          persistentVolumeClaim:
            claimName: notifications-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-db
  namespace: bookstore
spec:
  type: ClusterIP
  selector:
    app: notifications-db
  ports:
    - port: 5432
      targetPort: 5432
