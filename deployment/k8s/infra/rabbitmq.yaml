apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: bookstore
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-rabbitmq
  namespace: bookstore
  labels:
    app: bookstore-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-rabbitmq
  template:
    metadata:
      labels:
        app: bookstore-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0.4-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-credentials
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: 150Mi
            limits:
              memory: 400Mi
      volumes:
        - name: rabbitmq-storage
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
---
# Internal AMQP access for order/notification services
apiVersion: v1
kind: Service
metadata:
  name: bookstore-rabbitmq
  namespace: bookstore
spec:
  type: ClusterIP
  selector:
    app: bookstore-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
# NodePort so you can open the management UI directly at localhost:30672
apiVersion: v1
kind: Service
metadata:
  name: bookstore-rabbitmq-management
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: bookstore-rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30672
