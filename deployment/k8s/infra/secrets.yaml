# Shared credentials, reused via envFrom across DB pods and the services that connect to them.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bookstore
type: Opaque
stringData:
  POSTGRES_USER: postgres        # consumed by postgres containers
  POSTGRES_PASSWORD: postgres
  DB_USERNAME: postgres          # consumed by catalog/order/notification services
  DB_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: bookstore
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest   # consumed by the rabbitmq container
  RABBITMQ_DEFAULT_PASS: guest
  RABBITMQ_USERNAME: guest       # consumed by order/notification services
  RABBITMQ_PASSWORD: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: bookstore
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin1234
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-ui-secrets
  namespace: bookstore
type: Opaque
stringData:
  NEXTAUTH_SECRET: "JOf7uFUuehLi39w+XBYXDOg0etxroi/VxQNr/eLRJjE="
  KEYCLOAK_CLIENT_SECRET: "exgXuOOETCnHDI0jwaR3hjz3iWWZlWmA"
