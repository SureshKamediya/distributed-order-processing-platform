# IMPORTANT DIFFERENCE FROM YOUR COMPOSE SETUP:
# Your docker-compose promtail scrapes containers by mounting the Docker socket and reading
# /var/lib/docker/containers directly. That approach doesn't exist in Kubernetes — pods don't
# expose Docker's internals, and mounting the host's Docker socket into a pod is a real security
# hole (any pod with that mount can control the whole node's containerd). The Kubernetes-native
# way is: promtail runs as a DaemonSet (one copy per node), reads each node's /var/log/pods
# directly, and asks the Kubernetes API for pod/container metadata to label the logs. That's
# what this manifest does — it's not a translation of your old config, it's a different (correct)
# approach for this environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: bookstore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: bookstore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: bookstore
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: bookstore
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              memory: 50Mi
            limits:
              memory: 100Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
